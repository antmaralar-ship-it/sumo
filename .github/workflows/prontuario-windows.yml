name: instalador-windows-prontuario

# Compila SUMO para Windows con la ventana «Indicadores del prontuario»
# y genera el instalador .msi. Se lanza a mano desde la pestaña Actions
# (botón «Run workflow») o al subir cambios a la rama prontuario.

on:
  workflow_dispatch:
  push:
    branches:
      - prontuario

jobs:
  build:
    runs-on: windows-latest
    env:
      CC: cl
      CXX: cl
      SUMO_LIBRARIES: D:\a\sumo\sumo\SUMOLibraries

    steps:
    - name: Descargar SUMO
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        filter: tree:0
        ref: ${{ github.ref }}

    - name: Descargar las bibliotecas de SUMO para Windows
      uses: actions/checkout@v7
      with:
        repository: DLR-TS/SUMOLibraries
        path: SUMOLibraries

    - name: Preparar Visual Studio
      uses: compnerd/gha-setup-vsdevenv@v7

    - name: Preparar Python
      run: python -m pip install -r tools/req_ci.txt

    - name: Compilar SUMO
      run: |
        cmake -Bbuild_msvc -GNinja -DENABLE_JAVA_BINDINGS=false
        cmake --build build_msvc

    - name: Generar el instalador
      run: |
        cd build_msvc
        cpack -B D:/cpkg

    - name: Publicar el instalador
      uses: actions/upload-artifact@v7
      with:
        name: instalador-sumo-prontuario
        path: |
          D:/cpkg/sumo-*.msi
          D:/cpkg/sumo-*.zip
